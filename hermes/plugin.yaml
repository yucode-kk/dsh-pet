name: dsh-pet
label: dsh-pet 桌宠
kind: standalone
version: 0.2.1
manifest_version: 2
api_version: 1
license: MIT
author: yucode-kk
homepage: https://github.com/yucode-kk/dsh-pet
upstream: https://github.com/PC2005-cloud/dsh-pet
description: >
  上游项目是本仓库的父仓库 PC2005-cloud/dsh-pet（桌宠本体、素材与 DSH 插件都出自上游，MIT）。
  本仓库是它的 fork，只新增 hermes/ 这一层适配，把同一只桌宠接成 Hermes 原生插件：启用后以
  独立模式拉起一只桌宠窗口。用仓库根安装脚本装时，插件目录里自带一份 dsh-pet 运行时（复制
  lib/、桌面 helper 与素材，不重写桌宠核心），装完不依赖仓库路径，卸载时整目录一起走；
  从插件市场安装（只 clone 插件子目录）时，首次启动会用插件自带的锁文件
  （runtime-lock/package-lock.json，全树精确版本 + sha512 integrity）跑 `npm ci`
  装一份 dsh-pet@0.4.7 运行时到插件数据目录（一次性下载约 80 MB，需要联网）。
  子进程只拿到白名单里的最小环境（PATH/TEMP/USERPROFILE 等 + DSH_HOME），不继承 Hermes 的
  provider key。固定版本不是自更新，升级随新 PR。Hermes 的回合与工具活动映射到桌宠的工作状态。
  数据根、配置、对话记忆全部落在 Hermes 插件数据目录，和 DSH 那边互不可见；唯一例外是
  Electron 的 userData（dsh-pet 里写死成共用 `%APPDATA%\dsh-pet-electron-helper`）。
  附带 `hermes dsh-pet status|start|stop|uninstall` 管理命令，用来随时停掉或彻底移除。
requires_hermes: ">=0.22.0"

# 运行时是插件自带的那份 dsh-pet（Node 进程），Hermes 的 Python 环境不装、也不碰。
python_runtime: external

# 只做宿主适配，不新增模型可调用工具。
provides_tools: []

# 最小映射：会话开始 → thinking，工具结束 → working，回合结束 → 清回空闲。
provides_hooks:
  - on_session_start
  - post_tool_call
  - on_session_end

config_schema:
  autostart: {type: bool, default: true, description: 网关启动时自动拉起桌宠}
  node_path: {type: str, default: "", description: node 可执行文件路径（留空用 PATH 里的 node）}
  port: {type: int, default: 3080, description: 桌宠本机服务起始端口（被占用会自动顺延）}
  dsh_pet_path: {type: str, default: "", description: dsh-pet 包路径（留空用插件目录里自带的 dsh-pet/）}